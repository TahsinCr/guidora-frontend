<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="guidora_bg" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle with gradient -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#guidora_bg)" filter="url(#glow)" />

  <!-- Outer circular compass ring -->
  <circle cx="20" cy="20" r="11" stroke="#FFFFFF" stroke-width="2.75" fill="none" />

  <!-- Inner solid compass needle pointer -->
  <polygon points="20,12 24,20 20,18.2 16,20" fill="#FFFFFF" />
  <polygon points="20,28 24,20 20,21.8 16,20" fill="#FFFFFF" fill-opacity="0.75" />

  <!-- Center compass pivot dot -->
  <circle cx="20" cy="20" r="1.3" fill="url(#guidora_bg)" />
</svg>
