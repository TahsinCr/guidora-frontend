# ========================================================
# Guidora Full-Stack Production & Staging Orchestration
# ========================================================
name: guidora

services:
  # ------------------------------------------------------
  # Frontend Client (Nginx SPA + Reverse Proxy)
  # ------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # Optional: Mount runtime config.json directly from host without rebuilding container!
      - ./public/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - guidora

  # ------------------------------------------------------
  # Backend API (.NET 10 WebAPI)
  # ------------------------------------------------------
  backend:
    build:
      context: ../guidora-backend-api-dotnet
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Guidora: Host=postgres;Port=5432;Database=${POSTGRES_DB:-guidora};Username=${POSTGRES_USER:-guidora};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      Redis__Configuration: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      Database__ApplyMigrationsOnStartup: ${DATABASE_APPLY_MIGRATIONS_ON_STARTUP:-false}
      Authorization__SyncOperationClaimsOnStartup: ${AUTHORIZATION_SYNC_OPERATION_CLAIMS_ON_STARTUP:-false}
      TokenOptions__SecurityKey: ${TOKEN_OPTIONS__SECURITYKEY:?TOKEN_OPTIONS__SECURITYKEY must be set in .env}
      CommunityVerification__SignalHashKey: ${COMMUNITY_VERIFICATION_SIGNAL_HASH_KEY:-}
      EmailVerification__Enabled: ${EMAIL_VERIFICATION_ENABLED:-false}
      Cors__AllowedOrigins__0: ${WEB_CLIENT_ORIGIN:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - guidora

  # ------------------------------------------------------
  # PostgreSQL Database (Version 18.x)
  # ------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guidora}
      POSTGRES_USER: ${POSTGRES_USER:-guidora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - guidora-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - guidora

  # ------------------------------------------------------
  # Redis Cache & Token Session Store
  # ------------------------------------------------------
  redis:
    image: redis:8.10.1-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lfu"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - guidora

volumes:
  guidora-postgres-data:

networks:
  guidora:
    driver: bridge
