# Guidora Frontend - Production Nginx Configuration
# High-Performance, Hardened Security, Single-Page Application (SPA) Routing

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ========================================================
    # SECURITY HEADERS
    # ========================================================
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ========================================================
    # BROTLI & GZIP COMPRESSION (Pre-compressed static assets)
    # ========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Pre-compressed files (.gz support)
    gzip_static on;

    # ========================================================
    # RUNTIME CONFIG & HTML (Never cache)
    # ========================================================
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # ========================================================
    # IMMUTABLE STATIC ASSETS (Cache for 1 year)
    # Vite chunks have hash in filename (e.g., index-ABC.js)
    # ========================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Favicon, SVGs, and Static Logos
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ========================================================
    # API REVERSE PROXY (Zero-CORS to Backend Container)
    # ========================================================
    location /api/ {
        # 'backend' is the service name in docker-compose network
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts matching client configuration
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Backend Health Check Passthrough
    location /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================================
    # SPA FALLBACK ROUTING
    # ========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========================================================
    # HEALTH CHECK FOR CONTAINER ORCHESTRATION (K8s / Docker)
    # ========================================================
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
